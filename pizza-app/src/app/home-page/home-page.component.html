<div class="home-container">
    <h1 style="color: white;">Order Pizza</h1>

    <div class="grid">
        <div class="col-6 form-section">
            <app-order-form (orderPlaced)="onOrderPlaced($event)"></app-order-form>
        </div>

        <div class="col-6 list-section">
            <app-order-list [orders]="orders" (cancel)="onCancelOrder($event)"
                (delete)="onDeleteOrder($event)"></app-order-list>
        </div>
    </div>
</div>

<div class="order-list">
    <h2 style="color: white;">My Orders</h2>

    <div class="search-bar">
        <input type="text" placeholder="Filter orders" [formControl]="searchControl" style="width: 95%;" />
    </div>

    <div class="orders-container">
        <div *ngFor="let order of filteredOrders" class="order-card">
            <div class="order-details">
                <h3>Table {{ order.tableNo }}</h3>
                <p>Size: {{ order.size }}</p>
                <p>Crust: {{ order.crust }}</p>
                <p>Topping: {{ order.topping }}</p>
                <p>Status: {{ order.status }}</p>
            </div>
            <div class="actions">
                <button *ngIf="order.id && order.status !== 'CANCELLED'" (click)="cancelOrder(order.id)"
                    class="cancel-btn">Cancel Order</button>
                <button *ngIf="order.id" (click)="deleteOrder(order.id)" class="delete-btn">Delete Order</button>
            </div>
        </div>
    </div>
</div>
